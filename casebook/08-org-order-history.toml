query = "orders-org-history"
fix_kind = "Composite B-tree index `(organizationId, createdAt)`"

problem = """
TopFlow's index `(organizationId, status)` finds the organisation's orders, but not in date
order. For the largest customer the plan fetches every one of its orders from the heap
(thousands of pages), sorts them by `createdAt` and returns the newest 20. The cost grows with
the customer's history, so the best customers get the slowest order page.
"""

fix = [
    '''CREATE INDEX CONCURRENTLY IF NOT EXISTS "orders_organizationId_createdAt_idx" ON orders ("organizationId", "createdAt")''',
]
revert = [
    '''DROP INDEX CONCURRENTLY IF EXISTS "orders_organizationId_createdAt_idx"''',
]

tradeoff = """
Equality on the first column and order on the second: the plan reads the organisation's
newest 20 index entries backwards and fetches 20 heap rows, whatever the size of the history.
TopFlow's `(organizationId, status)` index stays: it serves the status filter of the same page
and the dashboard's count by status with an index-only scan. Both indexes start with
`organizationId`, so each insert into `orders` pays for two indexes on that column;
`docs/indexing.md` discusses when to merge them.
"""

[before]
node_present = ["Sort"]

[after]
index_used = ["orders_organizationId_createdAt_idx"]
node_absent = ["Sort"]
no_seq_scan_on = ["orders"]
