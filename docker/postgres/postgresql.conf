# pg-lab node configuration (PostgreSQL 18).
# Memory settings are sized for a small shared Docker host and are overridden per run with
# "-c" arguments in compose.yaml (LAB_SHARED_BUFFERS and friends in .env).

# ─── Connections and authentication ──────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 100
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256
idle_in_transaction_session_timeout = '10min'

# ─── Memory (defaults; see compose.yaml) ─────────────────────────────────────
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB

# ─── Planner: Docker volumes live on SSD/NVMe storage ───────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
# Short OLTP statements gain nothing from JIT compilation; it only adds noise to timings.
jit = off

# ─── WAL, archiving and recovery (pgBackRest) ───────────────────────────────
wal_level = replica
# pg_rewind needs full-page images after hint-bit changes (data checksums are also on).
wal_log_hints = on
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = 'pgbackrest --stanza=topflow archive-push %p'
archive_timeout = 60s
restore_command = 'pgbackrest --stanza=topflow archive-get %f "%p"'

# ─── Streaming replication ──────────────────────────────────────────────────
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on
wal_receiver_timeout = 10s
wal_sender_timeout = 10s

# ─── Observability ──────────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = on
pg_stat_statements.track = top
track_io_timing = on
track_wal_io_timing = on
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 10s
log_min_duration_statement = 5s
