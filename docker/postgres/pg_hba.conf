# pg-lab client authentication. First matching line wins.
# Every network login uses SCRAM-SHA-256; there are no "trust", "password" or "md5" lines.
# TLS is not configured in the lab (see docs/security.md, "Limitations").
#
# TYPE  DATABASE     USER        ADDRESS   METHOD
# Maintenance inside the container (docker compose exec ... as the postgres OS user).
local   all          postgres              peer
local   all          all                   scram-sha-256
# Streaming replication and pg_basebackup between the two lab nodes.
host    replication  replicator  samenet   scram-sha-256
host    replication  all         all       reject
# The superuser may only connect from the lab's own Docker network.
host    all          postgres    samenet   scram-sha-256
host    all          postgres    all       reject
# Application, analyst, migrator, monitoring and rewind roles.
host    all          all         all       scram-sha-256
