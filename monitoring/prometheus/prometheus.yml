# Prometheus for pg-lab: scrapes one postgres_exporter per node every 5 seconds.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["exporter-pg1:9187"]
        labels:
          node: pg1
      - targets: ["exporter-pg2:9187"]
        labels:
          node: pg2

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
