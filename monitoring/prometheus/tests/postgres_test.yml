# Unit tests for the alert rules: promtool test rules monitoring/prometheus/tests/postgres_test.yml
# Series are synthetic; the metric and label names match postgres_exporter v0.20.1.
rule_files:
  - ../rules/postgres.yml

evaluation_interval: 30s

tests:
  - name: a node that stops answering alerts after one minute
    interval: 30s
    input_series:
      - series: 'pg_up{node="pg1"}'
        values: "1 1 0 0 0 0"
      - series: 'pg_up{node="pg2"}'
        values: "1 1 1 1 1 1"
      - series: 'pg_replication_is_replica{node="pg1"}'
        values: "0 0 0 0 0 0"
      - series: 'pg_replication_is_replica{node="pg2"}'
        values: "1 1 1 1 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: PostgresDown
        exp_alerts: []
      - eval_time: 2m30s
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: critical
              node: pg1
            exp_annotations:
              summary: "PostgreSQL on pg1 does not answer"
              description: "postgres_exporter cannot query pg1: the server is down or refuses the monitor role."
      - eval_time: 2m30s
        alertname: PostgresNoWritablePrimary
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No node accepts writes"
              description: "Every reachable node is a standby (or none is reachable): the application cannot write."

  - name: a promoted standby clears the no-primary alert
    interval: 30s
    input_series:
      - series: 'pg_up{node="pg1"}'
        values: "0 0 0 0 0 0"
      - series: 'pg_up{node="pg2"}'
        values: "1 1 1 1 1 1"
      - series: 'pg_replication_is_replica{node="pg2"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 2m30s
        alertname: PostgresNoWritablePrimary
        exp_alerts: []

  - name: replication lag above 30 seconds for two minutes
    interval: 30s
    input_series:
      - series: 'pg_replication_is_replica{node="pg2"}'
        values: "1x10"
      - series: 'pg_replication_lag_seconds{node="pg2"}'
        values: "0 0 45 60 75 90 105 120 135 150 165"
    alert_rule_test:
      - eval_time: 2m
        alertname: PostgresReplicationLagHigh
        exp_alerts: []
      - eval_time: 3m30s
        alertname: PostgresReplicationLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              node: pg2
            exp_annotations:
              summary: "Standby pg2 is 2m 0s behind"
              description: "Replay lag above 30 seconds for 2 minutes: reads on the standby are stale and a failover would lose that much."

  - name: an open transaction older than five minutes
    interval: 30s
    input_series:
      - series: 'pg_stat_activity_max_tx_duration{node="pg1",datname="topflow",state="idle in transaction"}'
        values: "0+30x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: PostgresLongRunningTransaction
        exp_alerts: []
      - eval_time: 7m
        alertname: PostgresLongRunningTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              node: pg1
            exp_annotations:
              summary: "A transaction on pg1 has been open for 7m 0s"
              description: "Long transactions hold locks and stop VACUUM from removing dead rows (bloat)."

  - name: connections above 80 percent of max_connections
    interval: 1m
    input_series:
      - series: 'pg_settings_max_connections{node="pg1"}'
        values: "100x10"
      - series: 'pg_stat_activity_count{node="pg1",datname="topflow",state="active"}'
        values: "50 50 70 70 70 70 70 70 70 70 70"
      - series: 'pg_stat_activity_count{node="pg1",datname="topflow",state="idle"}'
        values: "10 10 15 15 15 15 15 15 15 15 15"
    alert_rule_test:
      - eval_time: 5m
        alertname: PostgresConnectionsHigh
        exp_alerts: []
      - eval_time: 8m
        alertname: PostgresConnectionsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              node: pg1
            exp_annotations:
              summary: "pg1 uses 85% of max_connections"
              description: "New connections will be refused when the limit is reached; check the application's pool sizes."

  - name: a table with a fifth of its rows dead for half an hour
    interval: 5m
    input_series:
      - series: 'pg_stat_user_tables_n_dead_tup{node="pg1",datname="topflow",schemaname="public",relname="orders"}'
        values: "1000 60000x12"
      - series: 'pg_stat_user_tables_n_live_tup{node="pg1",datname="topflow",schemaname="public",relname="orders"}'
        values: "200000x12"
      - series: 'pg_stat_user_tables_n_dead_tup{node="pg1",datname="topflow",schemaname="public",relname="products"}'
        values: "500x12"
      - series: 'pg_stat_user_tables_n_live_tup{node="pg1",datname="topflow",schemaname="public",relname="products"}'
        values: "1000x12"
    alert_rule_test:
      - eval_time: 20m
        alertname: PostgresHighDeadTupleRatio
        exp_alerts: []
      - eval_time: 40m
        alertname: PostgresHighDeadTupleRatio
        exp_alerts:
          - exp_labels:
              severity: warning
              node: pg1
              datname: topflow
              schemaname: public
              relname: orders
            exp_annotations:
              summary: "orders on pg1 is 23.08% dead rows"
              description: "Autovacuum is not keeping up with updates and deletes on this table (bloat)."

  - name: failed WAL archiving alerts at once
    interval: 1m
    input_series:
      - series: 'pg_stat_archiver_failed_count{node="pg1"}'
        values: "0 0 0 1 2 3"
    alert_rule_test:
      - eval_time: 5m
        alertname: PostgresWalArchivingFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              node: pg1
            exp_annotations:
              summary: "WAL archiving fails on pg1"
              description: "archive_command (pgbackrest archive-push) failed 3 times in 10 minutes; point-in-time recovery would lose data and pg_wal keeps growing."

  - name: an unused slot and the WAL it keeps
    interval: 1m
    input_series:
      - series: 'pg_replication_slots_active{node="pg1",slot_name="pg2"}'
        values: "0x15"
      - series: 'pg_replication_slots_pg_wal_lsn_diff{node="pg1",slot_name="pg2"}'
        values: "3000000000x15"
    alert_rule_test:
      - eval_time: 6m
        alertname: PostgresReplicationSlotInactive
        exp_alerts:
          - exp_labels:
              severity: warning
              node: pg1
              slot_name: pg2
            exp_annotations:
              summary: "Replication slot pg2 on pg1 is not used"
              description: "Its standby is not connected. The slot keeps WAL on the primary until the standby returns or the slot is dropped."
      - eval_time: 12m
        alertname: PostgresReplicationSlotRetainsWal
        exp_alerts:
          - exp_labels:
              severity: critical
              node: pg1
              slot_name: pg2
            exp_annotations:
              summary: "Slot pg2 holds 2.794GiB of WAL on pg1"
              description: "WAL retained for a lagging or absent standby can fill the disk and stop the primary."
