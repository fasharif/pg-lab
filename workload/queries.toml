[[query]]
id = "dashboard-low-stock"
title = "Dashboard: products at or below their reorder threshold"
api = "apps/api/src/dashboard/dashboard.module.ts:62 DashboardService.stats -> product.findMany"
params = {}
sql = """
SELECT p.id, p.sku, p.name, p."stockQuantity", p."lowStockThreshold"
FROM products AS p
WHERE p."isActive"
  AND p."stockQuantity" <= p."lowStockThreshold"
ORDER BY p."stockQuantity" ASC
LIMIT 10
"""

