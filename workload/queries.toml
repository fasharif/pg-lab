[[query]]
id = "orders-admin-search"
title = "Back-office order search (order, PO or project number, customer or company name)"
api = "apps/api/src/orders/orders.service.ts:660 OrdersService.filters(search) via adminList()"
params = { pattern = "SELECT '%' || substr(min(\"orderNumber\"), 7, 9) || '%' FROM orders" }
note = "The search term is the start of an order number (for example 2024-0000), which matches about 100 orders."
sql = """
SELECT o.*
FROM orders AS o
WHERE o."orderNumber" ILIKE %(pattern)s
   OR o."purchaseOrderNumber" ILIKE %(pattern)s
   OR o."projectReference" ILIKE %(pattern)s
   OR o."userId" IN (SELECT u.id FROM users AS u WHERE u."fullName" ILIKE %(pattern)s)
   OR o."organizationId" IN (SELECT g.id FROM organizations AS g WHERE g.name ILIKE %(pattern)s)
ORDER BY o."createdAt" DESC
LIMIT 20 OFFSET 0
"""

[[query]]
id = "orders-admin-search-count"
title = "Back-office order search, number of matches (pagination total)"
api = "apps/api/src/orders/orders.service.ts:697 OrdersService.list() -> order.count (adminList with search)"
params = { pattern = "SELECT '%' || substr(min(\"orderNumber\"), 7, 9) || '%' FROM orders" }
sql = """
SELECT count(*)
FROM orders AS o
WHERE o."orderNumber" ILIKE %(pattern)s
   OR o."purchaseOrderNumber" ILIKE %(pattern)s
   OR o."projectReference" ILIKE %(pattern)s
   OR o."userId" IN (SELECT u.id FROM users AS u WHERE u."fullName" ILIKE %(pattern)s)
   OR o."organizationId" IN (SELECT g.id FROM organizations AS g WHERE g.name ILIKE %(pattern)s)
"""

[[query]]
id = "orders-admin-by-status"
title = "Back-office orders in one status (warehouse queue: PROCESSING)"
