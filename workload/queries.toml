# ─── Catalogue ─────────────────────────────────────────────────────────────

[[query]]
id = "catalogue-search"
title = "Storefront catalogue search, newest first"
api = "apps/api/src/catalog/products.service.ts:61 ProductsService.list(search, sort=newest)"
params = { pattern = "SELECT '%solenoid%'", tag = "SELECT 'solenoid'" }
sql = """
SELECT p.*
FROM products AS p
WHERE p."isActive"
  AND NOT p."isTradeOnly"
  AND (p.name ILIKE %(pattern)s
       OR p.sku ILIKE %(pattern)s
       OR p.brand ILIKE %(pattern)s
       OR p.description ILIKE %(pattern)s
       OR p.tags @> ARRAY[%(tag)s]::text[])
ORDER BY p."createdAt" DESC
LIMIT 20 OFFSET 0
"""

[[query]]
id = "catalogue-search-count"
title = "Storefront catalogue search, result count"
api = "apps/api/src/catalog/products.service.ts:93 ProductsService.list -> product.count"
params = { pattern = "SELECT '%solenoid%'", tag = "SELECT 'solenoid'" }
sql = """
SELECT count(*)
FROM products AS p
WHERE p."isActive"
  AND NOT p."isTradeOnly"
  AND (p.name ILIKE %(pattern)s
       OR p.sku ILIKE %(pattern)s
       OR p.brand ILIKE %(pattern)s
       OR p.description ILIKE %(pattern)s
       OR p.tags @> ARRAY[%(tag)s]::text[])
"""

[[query]]
id = "catalogue-categories"
title = "Category tree with visible product counts"
api = "apps/api/src/catalog/categories.service.ts:43 CategoriesService.list"
params = {}
sql = """
SELECT c.*,
       (SELECT count(*) FROM products AS p
        WHERE p."categoryId" = c.id AND p."isActive" AND NOT p."isTradeOnly") AS product_count
FROM categories AS c
ORDER BY c."displayOrder", c.name
"""

[[query]]
id = "catalogue-brands"
title = "Brand filter with product counts"
api = "apps/api/src/catalog/products.service.ts:120 ProductsService.brands"
params = {}
sql = """
SELECT p.brand, count(*)
FROM products AS p
WHERE p."isActive" AND NOT p."isTradeOnly" AND p.brand IS NOT NULL
GROUP BY p.brand
ORDER BY p.brand
"""

