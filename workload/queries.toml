# The workload: the SQL behind TopFlow Hub's API read paths.
#
# Every entry names the API method it comes from (paths are relative to the TopFlow
# repository at commit 61310d2, see sql/topflow/SOURCE.md). The API uses Prisma; each entry is
# the main statement Prisma sends for that call, written by hand with the same filters,
# ordering and page size (20 by default). Prisma loads included relations (user, organisation,
# line counts) with separate statements keyed by the ids of the page it just read; those are
# primary-key or foreign-key lookups and are not listed. Every paginated list() method runs
# its page and a count(*) with the same filter in one transaction ($transaction([findMany,
# count])), so each page below is followed by its pagination total.
#
# params: name -> SQL expression evaluated against the lab database. The value is inlined
# into the statement as a literal, so the plan is the same custom plan Prisma's bound
# parameters would get. Expressions pick rows the generator is known to create (for example
# organisation 1 is the largest customer).

# ─── Orders ────────────────────────────────────────────────────────────────

[[query]]
id = "orders-org-history"
title = "Order history of an organisation (trade portal, first page)"
api = "apps/api/src/orders/orders.service.ts:271 OrdersService.listForOrganization -> list()"
params = { org_id = "SELECT lab.uid('org', 1)" }
sql = """
SELECT o.*
FROM orders AS o
WHERE o."organizationId" = %(org_id)s
ORDER BY o."createdAt" DESC
LIMIT 20 OFFSET 0
"""

[[query]]
id = "orders-org-count"
title = "Order count of an organisation (pagination total)"
api = "apps/api/src/orders/orders.service.ts:697 OrdersService.list() -> order.count"
params = { org_id = "SELECT lab.uid('org', 1)" }
sql = """
SELECT count(*)
FROM orders AS o
WHERE o."organizationId" = %(org_id)s
"""

[[query]]
id = "orders-customer-history"
title = "Order history of a retail customer (first page)"
api = "apps/api/src/orders/orders.service.ts:238 OrdersService.listMine -> list()"
