# ─── Organisations (admin) ─────────────────────────────────────────────────

[[query]]
id = "organizations-admin-list"
title = "KYC queue: organisations, pending first, then newest"
api = "apps/api/src/organizations/organizations.service.ts:161 OrganizationsService.adminList"
params = {}
sql = """
SELECT g.*,
       (SELECT count(*) FROM organization_members AS m WHERE m."organizationId" = g.id) AS member_count
FROM organizations AS g
ORDER BY g.status ASC, g."createdAt" DESC
LIMIT 20 OFFSET 0
"""

[[query]]
id = "organizations-admin-count"
title = "KYC queue, number of organisations (pagination total)"
api = "apps/api/src/organizations/organizations.service.ts:185 OrganizationsService.adminList -> organization.count"
params = {}
sql = """
SELECT count(*)
FROM organizations AS g
"""
